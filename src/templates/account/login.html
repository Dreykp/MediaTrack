<!DOCTYPE html>
<html data-theme="light">
<head>
    <title>Login - {{ BRAND_NAME }}</title>
    {% load static %}
    <link href="{% static 'css/output.css' %}" rel="stylesheet" type="text/css" />
</head>
<body class="bg-base-200 text-base-content flex items-center justify-center min-h-screen p-4">
  <button id="theme-toggle" class="btn btn-ghost btn-circle absolute top-4 right-4">
    <svg id="sun-icon" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" stroke="none">
      <path fill-rule="evenodd" d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" clip-rule="evenodd" />
    </svg>

    <svg id="moon-icon" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
    </svg>
  </button>

  <div class="flex flex-col items-center justify-center p-4">
  <h2 class="text-3xl font-bold mb-6 text-center text-base-content">Login</h2>
  <p class="text-xl mb-6 text-center text-base-content">Sign in to your account</p>
  <div class="card bg-base-100 shadow-xl p-8 rounded-lg max-w-sm w-full">
    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-control mb-4">
        <label class="label">
          <span class="label-text">Username</span>
        </label>
        <input name="username"
               type="text"
               placeholder="Your username"
               class="input input-bordered w-full" />
      </div>
      <div class="form-control mb-6">
        <label class="label">
          <span class="label-text">Password</span>
        </label>
        <input name="password"
               type="password"
               placeholder="********"
               class="input input-bordered w-full" />
      </div>
      <div class="flex items-center justify-between">
        <button type="submit" class="btn btn-primary w-full">Login</button>
      </div>
    </form>
      <p class="text-center mt-4">Don't have an account? <a href="{% url 'register' %}" class="link link-primary">Sign up</a></p>
  </div>
  </div>
  <script src="{% static 'js/change_theme.js' %}"></script>
</body>
</html>
